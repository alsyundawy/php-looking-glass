<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="403 Forbidden - Access to this resource is forbidden."
    />
    <meta name="keywords" content="403, forbidden, error, looking glass" />
    <title>403 Forbidden</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #6c5ce7 0%, #d56bf2 100%);
        --text-main: #2d3748;
        --text-muted: #718096;
        --bg-glass: rgba(255, 255, 255, 0.95);
        --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        --border-radius: 16px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text-main: #f7fafc;
          --text-muted: #a0aec0;
          --bg-glass: rgba(26, 32, 44, 0.95);
          --shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--primary-gradient);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: var(--text-main);
        overflow-x: hidden;
      }

      .error-card {
        background: var(--bg-glass);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        max-width: 520px;
        width: 100%;
        padding: 40px 30px;
        text-align: center;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .error-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 90px;
        height: 90px;
        margin-bottom: 24px;
        animation: float 4s ease-in-out infinite;
      }

      .error-icon svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.1));
      }

      .error-number {
        font-size: 4rem;
        font-weight: 800;
        letter-spacing: -2px;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
        line-height: 1;
      }

      .error-message {
        margin-bottom: 24px;
      }

      .error-message h2 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .error-message p {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .lang-divider {
        height: 1px;
        background: rgba(0, 0, 0, 0.08);
        margin: 20px 0;
      }

      @media (prefers-color-scheme: dark) {
        .lang-divider {
          background: rgba(255, 255, 255, 0.08);
        }
      }

      .nav-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 24px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 30px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        outline: none;
        border: none;
        gap: 8px;
      }

      .btn-primary {
        background: var(--primary-gradient);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: rgba(0, 0, 0, 0.05);
        color: var(--text-main);
      }

      .btn-secondary:hover {
        background: rgba(0, 0, 0, 0.08);
        transform: translateY(-2px);
      }

      @media (prefers-color-scheme: dark) {
        .btn-secondary {
          background: rgba(255, 255, 255, 0.08);
        }
        .btn-secondary:hover {
          background: rgba(255, 255, 255, 0.12);
        }
      }

      .btn-secondary:active {
        transform: translateY(0);
      }

      .redirect-notice {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      #countdown {
        font-weight: 700;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        .error-card {
          padding: 30px 20px;
        }
        .nav-buttons {
          flex-direction: column;
        }
        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="error-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#6c5ce7"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      </div>
      <h1 class="error-number">403</h1>

      <!-- Indonesian -->
      <div class="error-message">
        <h2>Akses Dilarang</h2>
        <p>Anda tidak memiliki izin untuk mengakses halaman ini.</p>
      </div>

      <div class="lang-divider"></div>

      <!-- English -->
      <div class="error-message">
        <h2>Forbidden</h2>
        <p>You don't have permission to access this page.</p>
      </div>

      <div class="nav-buttons">
        <button onclick="safeNavigateBack()" class="btn btn-primary">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Kembali / Back
        </button>
        <a href="./" class="btn btn-secondary">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Beranda / Home
        </a>
      </div>

      <div class="redirect-notice">
        Otomatis kembali dalam / Redirecting in <span id="countdown">30</span>s
      </div>
    </div>

    <script>
      let seconds = 30;
      const countdownEl = document.getElementById("countdown");
      const countdown = setInterval(() => {
        seconds--;
        if (countdownEl) countdownEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(countdown);
          window.location.href = "./";
        }
      }, 1000);

      function safeNavigateBack() {
        clearInterval(countdown);
        if (
          history.length > 1 &&
          document.referrer.includes(window.location.host)
        ) {
          history.back();
        } else {
          window.location.href = "./";
        }
      }
    </script>
  </body>
</html>
